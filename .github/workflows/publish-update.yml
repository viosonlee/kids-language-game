name: Publish APK update

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Public binary-only owner/repository (one app variant per repository)
        required: true
        default: viosonlee/kid-game-release
      variant:
        description: Match the installed app (current tablet uses debug)
        required: true
        type: choice
        options: [debug, release]
      version_code:
        description: Increasing Android versionCode
        required: true
      version_name:
        description: Display version, e.g. 1.0.2
        required: true
      notes:
        description: Parent-facing release notes
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      UPDATE_REPOSITORY: ${{ inputs.repository }}
      VARIANT: ${{ inputs.variant }}
      VERSION_CODE: ${{ inputs.version_code }}
      VERSION_NAME: ${{ inputs.version_name }}
      RELEASE_NOTES: ${{ inputs.notes }}
      GH_TOKEN: ${{ secrets.DISTRIBUTION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate destination and increasing version
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, subprocess, urllib.request, urllib.error
          repo, code, name = (os.environ[k] for k in ('UPDATE_REPOSITORY', 'VERSION_CODE', 'VERSION_NAME'))
          assert re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repo), 'Invalid repository'
          assert code.isdigit() and 0 < int(code) <= 2100000000, 'Invalid versionCode'
          assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9.+-]{0,63}', name), 'Invalid versionName'
          # Anonymous access is required: clients must never contain a GitHub token.
          with urllib.request.urlopen('https://api.github.com/repos/' + repo) as response:
              assert json.load(response)['private'] is False
          try:
              with urllib.request.urlopen('https://api.github.com/repos/' + repo + '/releases/latest') as response:
                  latest = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          else:
              asset = next((a for a in latest['assets'] if a['name'] == 'update-' + os.environ['VARIANT'] + '.json'), None)
              assert asset, 'Do not switch app variants in an existing distribution repository'
              with urllib.request.urlopen(asset['browser_download_url']) as response:
                  previous = json.load(response)
              assert int(code) > previous['versionCode'], 'versionCode must increase'
          assert os.environ['GH_TOKEN'], 'Configure DISTRIBUTION_TOKEN for the binary repository'
          open('release-notes.txt', 'w', encoding='utf-8').write(os.environ['RELEASE_NOTES'])
          PY
      - name: Restore signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.UPDATE_SIGNING_KEY_BASE64 }}
        run: |
          test -n "$SIGNING_KEY_BASE64"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/update-signing.jks"
          chmod 600 "$RUNNER_TEMP/update-signing.jks"
      - name: Test and build signed APK
        env:
          STORE_PASSWORD: ${{ secrets.UPDATE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPDATE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPDATE_KEY_PASSWORD }}
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          chmod +x gradlew
          ./gradlew test "assemble${VARIANT^}" \
            "-PappVersionCode=$VERSION_CODE" "-PappVersionName=$VERSION_NAME" \
            "-PupdateRepository=$UPDATE_REPOSITORY" \
            "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/update-signing.jks" \
            "-Pandroid.injected.signing.store.password=$STORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$KEY_PASSWORD"
      - name: Prepare verified update assets
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          python scripts/prepare_app_update.py \
            --apk "app/build/outputs/apk/$VARIANT/app-$VARIANT.apk" \
            --aapt "$BUILD_TOOLS/aapt" --apksigner "$BUILD_TOOLS/apksigner" \
            --repository "$UPDATE_REPOSITORY" --variant "$VARIANT" \
            --tag "v$VERSION_NAME-$VERSION_CODE" --notes release-notes.txt
      - name: Upload draft, then publish complete release
        run: |
          TAG="v$VERSION_NAME-$VERSION_CODE"
          gh release create "$TAG" --repo "$UPDATE_REPOSITORY" --draft \
            --title "$VERSION_NAME" --notes-file release-notes.txt \
            "build/update-release/app-$VARIANT.apk" "build/update-release/update-$VARIANT.json"
          gh release edit "$TAG" --repo "$UPDATE_REPOSITORY" --draft=false --latest
      - name: Remove runner signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/update-signing.jks"
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-test-reports
          path: app/build/reports/tests/
